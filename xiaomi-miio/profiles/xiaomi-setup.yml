name: xiaomi-setup.v1
components:
  - id: main
    capabilities:
      - id: refresh
        version: 1
    categories:
      - name: Others
preferences:
  - name: deviceModel
    title: 기기 종류
    description: 연결할 Xiaomi 기기를 선택하세요
    required: true
    preferenceType: enumeration
    definition:
      options:
        fan_za5: Mi Smart Standing Fan 2
        airp_cpa4: Mi Air Purifier 4 Compact
        derh_13l: Xiaomi Smart Dehumidifier 13L
      default: fan_za5
  - name: deviceIp
    title: 기기 IP 주소
    description: 192.168.x.x 형식
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "0.0.0.0"
  - name: deviceToken
    title: 기기 Token (32-hex)
    description: Xiaomi-Cloud-Tokens-Extractor 로 추출
    required: true
    preferenceType: string
    definition:
      stringType: password
      minLength: 32
      maxLength: 32
      default: "00000000000000000000000000000000"
  - name: showAdvanced
    title: 고급 기능 표시
    description: 연결 후 세부 기능까지 표시합니다
    required: true
    preferenceType: boolean
    definition:
      default: false
