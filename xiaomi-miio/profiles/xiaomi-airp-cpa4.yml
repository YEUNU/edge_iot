    description: 자동 검색으로 확보되지 않을 때만 기기의 32자리 로컬 토큰 입력
    required: true
    preferenceType: string
    definition:
      stringType: password
      minLength: 32
      maxLength: 32
      default: "00000000000000000000000000000000"
