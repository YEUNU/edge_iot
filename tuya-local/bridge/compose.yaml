name: tuya-local
services:
  bridge:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    user: "${TUYA_UID:-1000}:${TUYA_GID:-1000}"
    ports:
      - "${TUYA_BIND_IP:-127.0.0.1}:8766:8766"
    volumes:
      - ./data/config.json:/data/config.json:ro
      - ./state:/state
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8766, timeout=4); c.request('GET', '/v1/state'); r = c.getresponse(); r.read(); assert r.status == 401"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
