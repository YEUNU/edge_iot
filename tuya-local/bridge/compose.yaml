name: tuya-local
services:
  bridge:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    user: "${TUYA_UID:-1000}:${TUYA_GID:-1000}"
    ports:
      - "${TUYA_BIND_IP:-127.0.0.1}:8766:8766"
    volumes:
      - ./data/config.json:/data/config.json:ro
      - ./state:/state
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
